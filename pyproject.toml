[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-synapse"
dynamic = ["version"]
description = "A pytest plugin for OpenAPI contract test coverage"
readme = "docs/README.md"
license = "MIT"
requires-python = ">=3.11,<4.0.0"
authors = [
    {name = "pytest-synapse contributors"}
]
keywords = ["pytest", "openapi", "coverage", "api", "testing", "contract"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0.0",
    "openapi-core>=0.18.0",
    "pyyaml>=6.0",
    "werkzeug>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "responses>=0.23.0",
    "respx>=0.20.0",
    "flask>=2.0.0",
]

[project.entry-points.pytest11]
synapse = "pytest_synapse.plugin"

[project.urls]
Homepage = "https://github.com/Jacky97s/pytest-synapse"
Documentation = "https://github.com/Jacky97s/pytest-synapse#readme"

[tool.hatch.version]
path = "src/pytest_synapse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_synapse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
